[package]
name = "elsewhere"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# yt-dlp utility through embedded Python (src/ytdlp). Off by default: without it the app builds with no Python.
ytdlp = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true }
rusqlite = { version = "0.41", features = ["bundled"] }
slint = "1.18"

[build-dependencies]
slint-build = "1.18"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }

# Linux desktop only: load fontconfig at runtime, so builds need no fontconfig dev headers.
# Keep the version in step with the fontique version Slint uses.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[[test]]
name = "ytdlp"
required-features = ["ytdlp"]
