[package]
name = "elsewhere"
version = "0.5.0"
edition = "2024"

# The shared core of the Android and iOS apps (android/, ios/). They call it through
# src/api.rs; the build scripts compile it as a cdylib (Android) or staticlib (iOS).
[lib]
crate-type = ["rlib"]

[features]
# yt-dlp utility through embedded Python (src/ytdlp), with a built-in JavaScript engine for
# YouTube (third_party/quickjs). Off by default: without it the core builds with no Python.
ytdlp = ["dep:pyo3", "dep:cc"]
# Save YouTube and YouTube Music playlists into the library (src/playlists). Built on ytdlp.
playlists = ["ytdlp", "dep:serde_json"]
# The media engine (src/player): plays local files through libmpv, which is loaded when the
# first player is made. No build dependency: the core builds without libmpv.
player = []
# The uniffi-bindgen tool, which writes the Kotlin and Swift bindings. Build machines only.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
pyo3 = { version = "0.30", optional = true }
rusqlite = { version = "0.41", features = ["bundled"] }
# Reads yt-dlp's info JSON and the lyrics service's answers (playlists feature).
serde_json = { version = "1", optional = true }
uniffi = { version = "0.32", default-features = false }

[build-dependencies]
# Compiles QuickJS for the ytdlp feature. Already in the build through rusqlite's bundled SQLite.
cc = { version = "1", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[test]]
name = "ytdlp"
required-features = ["ytdlp"]

[[test]]
name = "playlists"
required-features = ["playlists"]

[[test]]
name = "api"
required-features = ["playlists"]

[[test]]
name = "api_lazy"
required-features = ["playlists"]

[[test]]
name = "player"
required-features = ["player"]

[[test]]
name = "queue"
required-features = ["player"]

# Smaller phone builds: no debug info in the Rust core. Panics must unwind (never abort):
# the core catches them at its boundaries and heals (src/health.rs).
[profile.release]
strip = "debuginfo"
panic = "unwind"

[profile.dev]
panic = "unwind"
