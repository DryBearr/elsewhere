[package]
name = "elsewhere"
version = "0.3.0"
edition = "2024"

# The shared core of the Android and iOS apps (android/, ios/). They call it through
# src/api.rs; the build scripts compile it as a cdylib (Android) or staticlib (iOS).
[lib]
crate-type = ["rlib"]

[features]
# yt-dlp utility through embedded Python (src/ytdlp), with a built-in JavaScript engine for
# YouTube (third_party/quickjs). Off by default: without it the core builds with no Python.
ytdlp = ["dep:pyo3", "dep:cc"]
# The uniffi-bindgen tool, which writes the Kotlin and Swift bindings. Build machines only.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
pyo3 = { version = "0.30", optional = true }
rusqlite = { version = "0.41", features = ["bundled"] }
uniffi = { version = "0.32", default-features = false }

[build-dependencies]
# Compiles QuickJS for the ytdlp feature. Already in the build through rusqlite's bundled SQLite.
cc = { version = "1", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[test]]
name = "ytdlp"
required-features = ["ytdlp"]

# Smaller phone builds: no debug info in the Rust core.
[profile.release]
strip = "debuginfo"
