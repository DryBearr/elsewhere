[package]
name = "elsewhere"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# yt-dlp utility through embedded Python (src/ytdlp), with a built-in JavaScript engine for
# YouTube (third_party/quickjs). Off by default: without it the app builds with no Python.
ytdlp = ["dep:pyo3", "dep:cc"]

[dependencies]
pyo3 = { version = "0.30", optional = true }
rusqlite = { version = "0.41", features = ["bundled"] }
slint = "1.18"

[build-dependencies]
# Compiles QuickJS for the ytdlp feature. Already in the build through rusqlite's bundled SQLite.
cc = { version = "1", optional = true }
slint-build = "1.18"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }

# iOS draws with Skia on Metal (Slint's supported iOS renderer).
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.18", features = ["renderer-skia"] }

# Linux desktop only: load fontconfig at runtime, so builds need no fontconfig dev headers.
# Keep the version in step with the fontique version Slint uses.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[[test]]
name = "ytdlp"
required-features = ["ytdlp"]

# Android package. versionName comes from `version` above, and the release workflow
# checks that the git tag matches it. Build it with Python and yt-dlp inside:
#   python3 scripts/mobile_python.py android
#   PYO3_CROSS_LIB_DIR=$PWD/target/android/prefix/lib cargo apk build --release --lib --features ytdlp
[package.metadata.android]
package = "io.github.drybearr.elsewhere"
apk_name = "Elsewhere"
build_targets = ["aarch64-linux-android"]
# Made by scripts/mobile_python.py: the Python standard library and yt-dlp, and libpython.
assets = "target/android/assets"
runtime_libs = "target/android/libs"

# yt-dlp needs the network.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Elsewhere"
