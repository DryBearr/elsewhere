# XcodeGen spec for the iOS app. Needs a Mac. First build its parts, then the project:
#   python3 scripts/mobile_python.py ios     (Python with yt-dlp)
#   scripts/ios_rust.sh                      (the Rust core and its Swift bindings)
#   cd ios && xcodegen
# The release workflow sets MARKETING_VERSION and CURRENT_PROJECT_VERSION.
name: Elsewhere
options:
  bundleIdPrefix: io.github.drybearr
settings:
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  MARKETING_VERSION: "0.0.0"
  CURRENT_PROJECT_VERSION: "0"
targets:
  Elsewhere:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.drybearr.elsewhere
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Elsewhere
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Saved media (Documents/Media) shows up in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Playback goes on in the background (Elsewhere/Playback).
        UIBackgroundModes: [audio]
    sources:
      - Elsewhere
      # Swift bindings for the Rust core, written by scripts/ios_rust.sh.
      - path: ../target/ios/bindings/elsewhere.swift
      # The player's test files (72 KB), which the self-test plays (SelfTest.swift).
      - path: ../tests/media
        type: folder
        buildPhase: resources
    dependencies:
      # The Rust core (static library), from scripts/ios_rust.sh.
      - framework: ../target/ios/ElsewhereCore.xcframework
        embed: false
      # Python, with yt-dlp in its site-packages, from scripts/mobile_python.py.
      - framework: ../target/ios/Python.xcframework
        embed: true
      # libmpv for the media engine, from scripts/ios_mpv.sh; loaded when a player is made.
      - framework: ../target/ios/mpv.xcframework
        embed: true
    postCompileScripts:
      # Python's official helper: copies the standard library and yt-dlp into
      # Elsewhere.app/python, and turns each C module into a framework, as iOS requires.
      - name: Install Python
        basedOnDependencyAnalysis: false
        script: |
          set -e
          source "$PROJECT_DIR/../target/ios/Python.xcframework/build/utils.sh"
          # Unsigned CI builds sign the module frameworks ad hoc; SideStore signs them again.
          if [ "$CODE_SIGNING_ALLOWED" = "NO" ]; then
            EXPANDED_CODE_SIGN_IDENTITY="-"
          fi
          install_python ../target/ios/Python.xcframework
    scheme:
      testTargets:
        - ElsewhereUITests
  # The UI tests (MusicUITests.swift): xcodebuild test -only-testing:ElsewhereUITests.
  ElsewhereUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: io.github.drybearr.elsewhere.uitests
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.0"
    sources:
      - ElsewhereUITests
    dependencies:
      - target: Elsewhere
