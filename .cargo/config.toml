[env]
# Python that PyO3 builds against for the `ytdlp` feature on desktop. It needs
# libpython3.x.so, which Homebrew's Python has and Bazzite's system Python does not.
# Any Python 3.10+ works here; CI and the phone builds use 3.15. An environment
# variable with the same name overrides this.
PYO3_PYTHON = "/home/linuxbrew/.linuxbrew/bin/python3"

# iOS test programs (the app is built by Xcode and has both already): find Python.framework
# in a Frameworks folder next to them, and link UIKit, which Python's platform module asks
# for the iOS version (yt-dlp uses it while loading).
[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-Wl,-rpath,@executable_path/Frameworks", "-C", "link-arg=-Wl,-framework,UIKit"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-Wl,-rpath,@executable_path/Frameworks", "-C", "link-arg=-Wl,-framework,UIKit"]
