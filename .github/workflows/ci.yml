name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Point PyO3 at this Python and install yt-dlp for the tests
        run: |
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$pythonLocation/lib" >> "$GITHUB_ENV"
          python -m pip install --target vendor/python -r scripts/requirements.txt

      # The media engine loads libmpv at run time; the tests play files through it.
      - name: Install libmpv for the player tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libmpv-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: |
          cargo clippy --all-targets --features playlists,player -- -D warnings
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --features playlists,player
          cargo test --features player --test player -- --ignored --test-threads=1

      - name: Kotlin and Swift bindings can be generated
        run: |
          cargo rustc --lib --features ytdlp,player --crate-type cdylib
          cargo run --features bindgen --bin uniffi-bindgen -- generate --library target/debug/libelsewhere.so \
            --language kotlin --language swift --no-format --out-dir target/bindings

      - name: YouTube's JavaScript challenge, solved by the built-in engine
        run: cargo test --features ytdlp --test ytdlp -- --ignored youtube_challenge --nocapture

      # YouTube often blocks CI machines, so a failure here is a warning, not an error.
      - name: Real YouTube tests
        continue-on-error: true
        run: cargo test --features ytdlp --test ytdlp -- --ignored real_site
