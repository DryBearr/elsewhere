name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux libraries Slint needs
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Point PyO3 at this Python and install yt-dlp for the tests
        run: |
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$pythonLocation/lib" >> "$GITHUB_ENV"
          python -m pip install --target vendor/python yt-dlp

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --features ytdlp -- -D warnings

      - name: Test
        run: cargo test --features ytdlp
