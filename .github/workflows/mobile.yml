# Runs the yt-dlp tests (tests/ytdlp.rs) on an Android emulator and an iOS simulator,
# with the same Python, yt-dlp and (on Android) ffmpeg the phone builds bundle. Both jobs
# also start the real app and check that yt-dlp starts.
name: Mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-emulator

      - name: Prepare Python and yt-dlp for the emulator
        run: python3 scripts/mobile_python.py android x86_64

      - uses: actions/cache@v4
        with:
          path: target/ffmpeg/x86_64
          key: ffmpeg-x86_64-${{ hashFiles('scripts/android_ffmpeg.sh') }}

      - name: Build ffmpeg for the emulator
        run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" scripts/android_ffmpeg.sh x86_64

      - uses: actions/cache@v4
        with:
          path: target/mpv/x86_64
          key: mpv-x86_64-${{ hashFiles('scripts/android_mpv.sh', 'scripts/mpv_sources.sh') }}

      # The downloaded sources, so a new build does not depend on every server answering.
      - uses: actions/cache@v4
        with:
          path: target/mpv/sources
          key: mpv-sources-${{ hashFiles('scripts/mpv_sources.sh') }}

      - name: Build libmpv for the emulator
        run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" scripts/android_mpv.sh x86_64

      - name: Build the tests for Android
        run: |
          rustup target add x86_64-linux-android
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          export PYO3_PYTHON=python3
          export PYO3_CROSS_LIB_DIR="$PWD/target/android/prefix/lib"
          cargo test --no-run --features playlists,player --target x86_64-linux-android --lib --test ytdlp --test playlists --test api --test api_lazy --test recovery --test player --test queue --test api_queue \
            --message-format=json > build.json
          python3 scripts/test_binaries.py build.json elsewhere ytdlp playlists api api_lazy recovery player queue api_queue
          # Runs a test program on the emulator with the phone Python, and ffmpeg on PATH:
          #   run-tests.sh <elsewhere-tests|ytdlp-tests|...> [test arguments]
          cat > run-tests.sh <<'SCRIPT'
          cd /data/local/tmp/elsewhere
          export HOME=$PWD TMPDIR=$PWD/tmp LD_LIBRARY_PATH=$PWD/lib PATH=$PWD/bin:$PATH
          export YTDLP_TEST_PYTHON_HOME=$PWD/python YTDLP_TEST_FFMPEG=1 PLAYER_TEST_MEDIA=$PWD/media
          tests=$1
          shift
          exec ./$tests "$@"
          SCRIPT

      - name: Build the app for the emulator
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" scripts/android_rust.sh x86_64 debug
          gradle -p android assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk Elsewhere-x86_64.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests and the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # With sound: the app's self-test plays through the real sound output.
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          script: |
            adb shell mkdir -p /data/local/tmp/elsewhere/python /data/local/tmp/elsewhere/lib /data/local/tmp/elsewhere/bin /data/local/tmp/elsewhere/tmp
            adb push target/android/assets/python.tar /data/local/tmp/elsewhere/
            adb shell "cd /data/local/tmp/elsewhere/python && tar xf ../python.tar"
            adb push target/android/libs/x86_64/. /data/local/tmp/elsewhere/lib/
            adb push target/android/libs/x86_64/libffmpeg.so /data/local/tmp/elsewhere/bin/ffmpeg
            adb push target/android/libs/x86_64/libffprobe.so /data/local/tmp/elsewhere/bin/ffprobe
            adb push tests/media /data/local/tmp/elsewhere/
            adb push elsewhere-tests ytdlp-tests playlists-tests api-tests api_lazy-tests recovery-tests player-tests queue-tests api_queue-tests run-tests.sh /data/local/tmp/elsewhere/
            adb shell chmod 755 /data/local/tmp/elsewhere/player-tests /data/local/tmp/elsewhere/queue-tests /data/local/tmp/elsewhere/api_queue-tests /data/local/tmp/elsewhere/elsewhere-tests /data/local/tmp/elsewhere/recovery-tests /data/local/tmp/elsewhere/ytdlp-tests /data/local/tmp/elsewhere/playlists-tests /data/local/tmp/elsewhere/api-tests /data/local/tmp/elsewhere/api_lazy-tests /data/local/tmp/elsewhere/bin/ffmpeg /data/local/tmp/elsewhere/bin/ffprobe
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh elsewhere-tests --test-threads=4
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh recovery-tests
            # The media engine, again and again: timing bugs show up on a slow emulator.
            for run in 1 2 3; do adb shell sh /data/local/tmp/elsewhere/run-tests.sh player-tests --test-threads=4 || exit 1; done
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh player-tests --test-threads=1
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh player-tests --ignored --test-threads=1
            for run in 1 2 3; do adb shell sh /data/local/tmp/elsewhere/run-tests.sh queue-tests --test-threads=4 || exit 1; done
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh queue-tests --test-threads=1
            for run in 1 2 3; do adb shell sh /data/local/tmp/elsewhere/run-tests.sh api_queue-tests --test-threads=4 || exit 1; done
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh ytdlp-tests --test-threads=4
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh playlists-tests --test-threads=4
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh api-tests --test-threads=4
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh api_lazy-tests
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh ytdlp-tests --ignored youtube_challenge --nocapture
            adb shell sh /data/local/tmp/elsewhere/run-tests.sh ytdlp-tests --ignored real_site || echo "::warning::Real YouTube tests failed on the Android emulator (YouTube often blocks CI machines)"
            bash scripts/selftest_android.sh Elsewhere-x86_64.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # The runner's own Python 3 runs our scripts; downloading another one from GitHub
      # failed with 504 errors too often.
      - name: Python on the runner
        run: python3 --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-simulator

      - name: Prepare Python and yt-dlp for iOS
        run: python3 scripts/mobile_python.py ios

      - name: Install iOS build tools
        run: |
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          brew install xcodegen pkgconf

      - uses: actions/cache@v4
        with:
          path: target/mpv-ios
          key: mpv-ios-simulator-${{ hashFiles('scripts/ios_mpv.sh', 'scripts/mpv_sources.sh') }}

      - uses: actions/cache@v4
        with:
          path: target/mpv-ios/sources
          key: mpv-ios-sources-${{ hashFiles('scripts/mpv_sources.sh') }}

      - name: Build libmpv for the simulator
        run: scripts/ios_mpv.sh simulator

      - name: Start a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime, found in devices.items() if 'iOS' in runtime for d in found if d['name'].startswith('iPhone')))")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Build the tests for the simulator
        run: |
          slice="$PWD/target/ios/Python.xcframework/ios-arm64_x86_64-simulator"
          export PYO3_PYTHON=python3
          export PYO3_CROSS_LIB_DIR="$slice/lib-arm64"
          cargo test --no-run --features playlists,player --target aarch64-apple-ios-sim --lib --test ytdlp --test playlists --test api --test api_lazy --test recovery --test player --test queue --test api_queue \
            --message-format=json > build.json
          python3 scripts/test_binaries.py build.json elsewhere ytdlp playlists api api_lazy recovery player queue api_queue
          # Lay them out like the app: Frameworks/ next to the programs, and one Python
          # home with the shared standard library plus this slice's C modules.
          mkdir -p run/Frameworks run/python/lib
          mv elsewhere-tests ytdlp-tests playlists-tests api-tests api_lazy-tests recovery-tests player-tests queue-tests api_queue-tests run/
          cp -R "$slice/Python.framework" run/Frameworks/
          cp -R target/ios/mpv.xcframework/ios-arm64-simulator/mpv.framework run/Frameworks/
          cp -R target/ios/Python.xcframework/lib/python3.15 run/python/lib/
          cp -R "$slice/lib-arm64/python3.15/" run/python/lib/python3.15/
          find run -name '*.so' -exec codesign --force --sign - {} \;
          codesign --force --sign - run/Frameworks/Python.framework run/Frameworks/mpv.framework run/player-tests run/queue-tests run/api_queue-tests run/elsewhere-tests run/recovery-tests run/ytdlp-tests run/playlists-tests run/api-tests run/api_lazy-tests

      - name: Run the tests in the simulator
        run: |
          export SIMCTL_CHILD_YTDLP_TEST_PYTHON_HOME="$PWD/run/python"
          xcrun simctl spawn "$UDID" "$PWD/run/elsewhere-tests" --test-threads=4
          xcrun simctl spawn "$UDID" "$PWD/run/recovery-tests"
          # The media engine, again and again: timing bugs show up on a busy simulator.
          export SIMCTL_CHILD_PLAYER_TEST_MEDIA="$PWD/tests/media"
          for run in 1 2 3; do xcrun simctl spawn "$UDID" "$PWD/run/player-tests" --test-threads=4 || exit 1; done
          xcrun simctl spawn "$UDID" "$PWD/run/player-tests" --test-threads=1
          for run in 1 2 3; do xcrun simctl spawn "$UDID" "$PWD/run/queue-tests" --test-threads=4 || exit 1; done
          xcrun simctl spawn "$UDID" "$PWD/run/queue-tests" --test-threads=1
          for run in 1 2 3; do xcrun simctl spawn "$UDID" "$PWD/run/api_queue-tests" --test-threads=4 || exit 1; done
          xcrun simctl spawn "$UDID" "$PWD/run/ytdlp-tests" --test-threads=4
          xcrun simctl spawn "$UDID" "$PWD/run/playlists-tests" --test-threads=4
          xcrun simctl spawn "$UDID" "$PWD/run/api-tests" --test-threads=4
          xcrun simctl spawn "$UDID" "$PWD/run/api_lazy-tests"
          # YouTube's JavaScript challenge, solved by the built-in engine (a static file
          # from youtube.com, which is not blocked like videos are).
          xcrun simctl spawn "$UDID" "$PWD/run/ytdlp-tests" --ignored youtube_challenge --nocapture

      # YouTube often blocks CI machines, so a failure here is a warning, not an error.
      - name: Run the real YouTube tests in the simulator
        continue-on-error: true
        run: |
          SIMCTL_CHILD_YTDLP_TEST_PYTHON_HOME="$PWD/run/python" \
            xcrun simctl spawn "$UDID" "$PWD/run/ytdlp-tests" --ignored real_site

      - name: Build the app for the simulator
        run: |
          scripts/ios_rust.sh simulator debug
          cd ios
          xcodegen
          xcodebuild build \
            -project Elsewhere.xcodeproj \
            -scheme Elsewhere \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES

      - name: Check the job path through the app
        run: |
          app="$RUNNER_TEMP/derived/Build/Products/Debug-iphonesimulator/Elsewhere.app"
          scripts/selftest_ios.sh "$UDID" "$app"
