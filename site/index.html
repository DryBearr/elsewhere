<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elsewhere</title>
<meta name="description" content="Download Elsewhere for Android and iOS.">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #f4f1e8;
    --card: #ffffff;
    --text: #1d2422;
    --muted: #5d6865;
    --line: #e2ddd0;
    --accent: #185e52;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121816;
      --card: #1b2321;
      --text: #ecebe6;
      --muted: #9aa5a1;
      --line: #2c3633;
      --accent: #5fb8a4;
      --accent-text: #0e1513;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
  header img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 0; font-size: 28px; }
  header p { margin: 2px 0 0; color: var(--muted); }
  section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .button {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .button.primary { background: var(--accent); color: var(--accent-text); }
  .note { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
  code {
    display: block;
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--bg);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.png" alt="">
    <div>
      <h1>Elsewhere</h1>
      <p id="version">Fully offline. Everything stays on your device.</p>
    </div>
  </header>

  <section>
    <h2>Android</h2>
    <div class="buttons">
      <a class="button primary" id="obtainium" href="#">Add to Obtainium</a>
      <a class="button" id="apk" href="#">Download APK</a>
    </div>
    <p class="note">Obtainium installs Elsewhere and keeps it updated from GitHub releases.</p>
  </section>

  <section>
    <h2>iPhone and iPad</h2>
    <div class="buttons">
      <a class="button primary" id="sidestore" href="#">Add to SideStore</a>
      <a class="button" id="altstore" href="#">Add to AltStore</a>
      <a class="button" id="ipa" href="#">Download IPA</a>
    </div>
    <p class="note">If a button does nothing, add this source by hand:<code id="source"></code></p>
  </section>
</main>
<script>
  const repo = "https://github.com/DryBearr/elsewhere";
  const source = new URL("source.json", location.href).href;

  document.getElementById("obtainium").href = "obtainium://add/" + repo;
  document.getElementById("apk").href = repo + "/releases/latest/download/Elsewhere.apk";
  document.getElementById("sidestore").href = "sidestore://source?url=" + encodeURIComponent(source);
  document.getElementById("altstore").href = "altstore://source?url=" + encodeURIComponent(source);
  document.getElementById("ipa").href = repo + "/releases/latest/download/Elsewhere.ipa";
  document.getElementById("source").textContent = source;

  fetch(source)
    .then((response) => response.json())
    .then((data) => {
      const latest = data.apps?.[0]?.versions?.[0];
      if (latest) {
        document.getElementById("version").textContent =
          "Version " + latest.version + " · " + latest.date.slice(0, 10);
      }
    })
    .catch(() => {});
</script>
</body>
</html>
